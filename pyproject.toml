[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-abstraction"
version = "0.1.0"
description = "Async LLM backend abstraction with Retry-After aware clients."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Evan D'Entremont" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/evandentremont/llm-abstraction"
Repository = "https://github.com/evandentremont/llm-abstraction"
Issues = "https://github.com/evandentremont/llm-abstraction/issues"

[project.optional-dependencies]
dev = [
    "build>=1.2.0",
    "mypy>=1.17.0",
    "pyright>=1.1.400",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.12.0",
    "twine>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["llm_abstraction*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "N", "UP", "W"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
files = ["llm_abstraction", "tests"]

[tool.pyright]
include = ["llm_abstraction", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
venv = ".venv"
venvPath = "."
